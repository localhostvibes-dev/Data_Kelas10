    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; }
        .info-box { background-color: #e8f4fd; border-left: 4px solid #3498db; padding: 12px; margin-bottom: 20px; font-size: 14px; }
        .query-section { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        .input-container { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; font-family: monospace; font-size: 15px; border: 2px solid #bdc3c7; border-radius: 4px; }
        button { background-color: #3498db; color: white; border: none; padding: 0 25px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .error-message { background-color: #fde8e8; color: #e74c3c; border-left: 4px solid #e74c3c; padding: 10px; margin-top: 10px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .row-count { font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h2>Console Query SQL - Data Siswa MPLS</h2>
    <div class="info-box">
        <strong>Nama Tabel:</strong> <code>siswa_mpls</code> | <strong>Kolom:</strong> Nomer, nama_siswa, nama_panggilan, kelas
    </div>
    <div class="query-section">
        <label for="sqlQuery">Masukkan Perintah SQL / Pencarian Anda:</label>
        <div class="input-container">
            <input type="text" id="sqlQuery" value="SELECT * FROM siswa_mpls WHERE kelas = 'MP'">
            <button onclick="jalankanQueryEngine()">Jalankan SQL</button>
        </div>
        <div id="errorBox" class="error-message"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 20px;">
        <h3>Hasil Eksekusi Data:</h3>
        <div class="row-count" id="jumlahData">Menampilkan: 0 baris</div>
    </div>
    <table id="tabelHasil">
        <thead>
            <tr>
                <th>Nomer</th>
                <th>Nama Siswa</th>
                <th>Nama Panggilan</th>
                <th>Kelas</th>

        <tbody id="tabelBody"></tbody>
    </table>
</div>

        { Nomer: 40, nama_siswa: "Zaqonita lovisti f", nama_panggilan: "Tata", kelas: "MP" }
    ];

    window.onload = function() { jalankanQueryEngine(); };

    function jalankanQueryEngine() {
        const query = document.getElementById('sqlQuery').value.trim().replace(/\s+/g, ' ');
        const errorBox = document.getElementById('errorBox');
        const tbody = document.getElementById('tabelBody');
        const jumlahData = document.getElementById('jumlahData');

        errorBox.style.display = "none";
        tbody.innerHTML = "";
        
        if (!query.toUpperCase().startsWith("SELECT") || !query.toUpperCase().includes("FROM SISWA_MPLS")) {
            errorBox.innerText = "Sintaks SQL Salah: Gunakan format 'SELECT * FROM siswa_mpls WHERE kelas = \'MP\''";
            errorBox.style.display = "block";
            jumlahData.innerText = "Menampilkan: 0 baris";
            return;
        }

        let hasil = [...databaseSiswa];
        if (query.toUpperCase().includes("WHERE")) {
            const match = query.match(/kelas\s*=\s*['"](.*?)['"]/i);
            if (match) {
                const target = match[1].toLowerCase();
                hasil = hasil.filter(s => s.kelas.toLowerCase() === target);
            }
        }

        jumlahData.innerText = "Menampilkan: " + hasil.length + " baris";
        if (hasil.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Data tidak ditemukan</td></tr>`;
            return;
        }

        hasil.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${row.Nomer}</td><td>${row.nama_siswa}</td><td>${row.nama_panggilan}</td><td>${row.kelas}</td>`;
            tbody.appendChild(tr);
        });
    }
</script>

</html>
