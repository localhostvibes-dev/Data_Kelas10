<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database SQL Terintegrasi di HTML</title>
    <!-- Memuat Library SQL.js via CDN agar bisa menjalankan SQL asli di HTML -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 30px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 1000px; margin: auto; }
        h2 { text-align: center; color: #2c3e50; }
        
        /* Dashboard Statistik */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 0.9rem; text-transform: uppercase; }
        .angka { font-size: 1.8rem; font-weight: bold; color: #2c3e50; margin: 0; }
        ul { padding-left: 20px; margin: 0; }

        /* Tabel Data */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: #2c3e50; color: white; }
        tr:hover { background-color: #f9f9f9; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #3498db; }
        
        .loading { text-align: center; font-weight: bold; color: #7f8c8d; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Database Siswa (HTML + SQL Engine Berhasil)</h2>

    <!-- Tempat Output Rumus SQL 2 & Rumus SQL 3 -->
    <div class="dashboard">
        <div class="card">
            <h3>Total Ringkasan (Rumus SQL 2)</h3>
            <p class="angka" id="stat-siswa">Memuat database...</p>
        </div>
        <div class="card">
            <h3>Sebaran Per Kelas (Rumus SQL 3)</h3>
            <ul id="stat-kelas"><li>Memuat database...</li></ul>
        </div>
    </div>

    <!-- Tempat Output Rumus SQL 1 (Tabel Utama) -->
    <table>
        <thead>
            <tr>
                <th>Foto Orang</th>
                <th>Nomor Induk</th>
                <th>Nama Siswa</th>
                <th>Kelas</th>
            </tr>
        </thead>
        <tbody id="tabel-siswa">
            <tr>
                <td colspan="4" class="loading">Sedang memproses perintah SQL...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // Konfigurasi untuk memuat file WebAssembly SQL.js
    const config = { 
        locateFile: filename => `https://cloudflare.com{filename}` 
    };
    
    initSqlJs(config).then(function(SQL){
        // 1. MEMBUAT DATABASE SQL BARU DI MEMORI BROWSER
        const db = new SQL.Database();

        // 2. MEMBUAT TABEL SQL (Murni berisi Nomor, Nama, Kelas, Foto)
        db.run(`CREATE TABLE siswa (
            nomor TEXT PRIMARY KEY,
            nama_siswa TEXT NOT NULL,
            kelas TEXT NOT NULL,
            foto TEXT NOT NULL
        );`);

        // 3. MENGISI DATA KE DATABASE SQL
        db.run(`INSERT INTO siswa VALUES 
            ('1001', 'Budi Santoso', '12 RPL 1', 'https://unsplash.com'),
            ('1002', 'Siti Aminah', '12 RPL 1', 'https://unsplash.com'),
            ('1003', 'Rian Hidayat', '12 RPL 2', 'https://unsplash.com'),
            ('1004', 'Alya Putri', '12 RPL 2', 'https://unsplash.com');
        `);

        // ========================================================
        // EKSEKUSI LEBIH DARI SATU RUMUS / PERINTAH SQL ASLI
        // ========================================================

        // --- RUMUS SQL 1: Mengambil semua data utama siswa untuk tabel ---
        const rumus_sql_1 = db.exec("SELECT foto, nomor, nama_siswa, kelas FROM siswa ORDER BY nomor ASC");
        const barisSiswa = rumus_sql_1[0].values; // Perbaikan pembacaan array array [0]
        const tbody = document.getElementById('tabel-siswa');
        tbody.innerHTML = ''; // Hapus tulisan loading
        
        barisSiswa.forEach(row => {
            // row[0] = foto, row[1] = nomor, row[2] = nama_siswa, row[3] = kelas
            tbody.innerHTML += `
                <tr>
                    <td><img src="${row[0]}" class="avatar" alt="Foto"></td>
                    <td>${row[1]}</td>
                    <td><strong>${row[2]}</strong></td>
                    <td>${row[3]}</td>
                </tr>
            `;
        });

        // --- RUMUS SQL 2: Rumus menghitung total siswa & jumlah kelas unik ---
        const rumus_sql_2 = db.exec("SELECT COUNT(*), COUNT(DISTINCT kelas) FROM siswa");
        const totalSiswa = rumus_sql_2[0].values[0][0];
        const totalKelas = rumus_sql_2[0].values[0][1];
        document.getElementById('stat-siswa').innerText = `${totalSiswa} Siswa (${totalKelas} Kelas)`;

        // --- RUMUS SQL 3: Rumus mengelompokkan sebaran jumlah siswa per kelas ---
        const rumus_sql_3 = db.exec("SELECT kelas, COUNT(*) FROM siswa GROUP BY kelas");
        const barisKelas = rumus_sql_3[0].values;
        const ulKelas = document.getElementById('stat-kelas');
        ulKelas.innerHTML = ''; // Hapus tulisan loading
        
        barisKelas.forEach(row => {
            // row[0] = nama kelas, row[1] = jumlah orang di kelas itu
            ulKelas.innerHTML += `<li>Kelas <strong>${row[0]}</strong>: ${row[1]} Orang</li>`;
        });
    });
</script>

</body>
</html>
