<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Query SQL - Siswa MPLS</title>
    <!-- Library SQL Browser Resmi & Paling Stabil -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; }
        .info-box {
            background-color: #e8f4fd; border-left: 4px solid #3498db;
            padding: 12px; margin-bottom: 20px; border-radius: 0 4px 4px 0; font-size: 14px;
        }
        .query-section { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; }
        .input-container { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 12px; font-family: monospace; font-size: 15px;
            border: 2px solid #bdc3c7; border-radius: 4px; box-sizing: border-box;
            background-color: #fafafa;
        }
        input[type="text"]:focus { border-color: #3498db; outline: none; }
        button {
            background-color: #3498db; color: white; border: none;
            padding: 0 25px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;
        }
        button:hover { background-color: #2980b9; }
        .error-message {
            background-color: #fde8e8; color: #e74c3c; border-left: 4px solid #e74c3c;
            padding: 10px; margin-top: 10px; border-radius: 0 4px 4px 0; font-size: 14px; display: none;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .row-count { margin-top: 10px; font-weight: bold; color: #7f8c8d; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Console Query SQL - Data Siswa MPLS</h2>
    
    <div class="info-box">
        <strong>Nama Tabel:</strong> <code>siswa_mpls</code> | 
        <strong>Kolom:</strong> <code>Nomer</code>, <code>nama_siswa</code>, <code>nama_panggilan</code>, <code>kelas</code>
    </div>

    <!-- Area Input Perintah SQL -->
    <div class="query-section">
        <label for="sqlQuery">Masukkan Perintah / Pencarian SQL Anda:</label>
        <div class="input-container">
            <input type="text" id="sqlQuery" value="SELECT * FROM siswa_mpls WHERE kelas = 'MP'">
            <button onclick="jalankanQuery()">Jalankan SQL</button>
        </div>
        <div id="errorBox" class="error-message"></div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Hasil Eksekusi Data:</h3>
        <div class="row-count" id="jumlahData">Menampilkan: 0 baris</div>
    </div>

    <!-- Tabel Output -->
    <table id="tabelHasil">
        <thead id="tabelHead">
            <!-- Kolom otomatis dibuat sesuai query -->
        </thead>
        <tbody id="tabelBody">
            <!-- Data siswa otomatis muncul disini -->
        </tbody>
    </table>
</div>

<script>
    // 1. MEMBUAT DATABASE DI BROWSER
    alasql("CREATE TABLE siswa_mpls (Nomer INT PRIMARY KEY, nama_siswa STRING, nama_panggilan STRING, kelas STRING)");

    // 2. INPUT DATA AWAL (Tanda petik satu yang bikin eror sebelumnya sudah dibersihkan)
    const dataAwal = [

        [3, "Alfiyatun Nur Nafizah", "Nefia", "MP"],
        [4, "Anissa Nur Febrianti", "Nisa", "MP"],
        [5, "Annisa Khoirotul Umma", "Asa", "MP"],
        [6, "Artika sandy ardianty", "Sandy", "MP"],
        [7, "Aurellia Kinar Trixy P", "Aurel", "MP"],
        [8, "Aurillia devitasari", "Devita", "MP"],
        [9, "Aurillia devitasari", "Ara cilung", "MP"],
        [10, "Berliana d.s", "Berliana", "MP"],
        [11, "Devi al karoni", "Devi/Depik", "MP"],
        [12, "Eka dwi wardani", "Eka", "MP"],
        [13, "Asti Galuh Rahajeng", "Ajeng", "MP"],
        [14, "Elsa Divia M", "Elsa", "MP"],
        [15, "Febriana attalya Z", "Ayara", "MP"],
        [16, "Intan dwi M", "Intan", "MP"],
        [17, "Juanita Dwi P", "Nita", "MP"],
        [18, "Kaiva muniroh", "Kaiva", "MP"],
        [19, "Kirani Adelia S", "Kirani", "MP"],
        [20, "Lyla auliya", "Lala", "MP"],
        [21, "Madinah alianisa", "Nisa", "MP"],
        [22, "Maicha Risqina Wijayanti", "Qina/Maicha", "MP"],
        [23, "Mey Rinda Rahmatullah S", "Rinda", "MP"],
        [24, "Nafilah aliya S", "Nafilah", "MP"],
        [25, "Nasywa fudina N.I", "Naswa", "MP"],
        [26, "Natalie omega putri L", "Natalie", "MP"],
        [27, "Nayla izma aura", "Ella", "MP"],
        [28, "Nur aini syafiyah", "Aini", "MP"],
        [29, "Putri Hanifah sekar D", "Hanifah", "MP"],
        [30, "Rachel Evangeline R", "Acel", "MP"],
        [31, "Rachma Laila M", "Laila", "MP"],
        [32, "Riska nur r", "Riska", "MP"],
        [33, "Salsabilla aura dewi", "Salsa", "MP"],
        [34, "Septiyasa antonio", "Aca", "MP"],
        [35, "Septya Putri Adilla", "Septya", "MP"],
        [36, "Shafira amalia p.w", "Feyy", "MP"],
        [37, "Sifatul Asmawati", "Syif", "MP"],
        [38, "Tefrisia kanasybila gunawan", "Bila", "MP"],
        [39, "Zafina putri ramadhani", "Zafina", "MP"],
        [40, "Zaqonita lovisti f", "Tata", "MP"]
    ];

    // Masukkan semua data secara massal ke database internal
    dataAwal.forEach(siswa => {
        alasql("INSERT INTO siswa_mpls VALUES (?,?,?,?)", siswa);
    });

    // Jalankan pencarian otomatis pertama kali web dibuka
    jalankanQuery();

    // 3. FUNGSI UTAMA EKSEKUSI DATA
    function jalankanQuery() {
        const query = document.getElementById('sqlQuery').value;
        const errorBox = document.getElementById('errorBox');
        const thead = document.getElementById('tabelHead');
        const tbody = document.getElementById('tabelBody');
        const jumlahData = document.getElementById('jumlahData');

        errorBox.style.display = "none";
        thead.innerHTML = "";
        tbody.innerHTML = "";
        jumlahData.innerText = "Menampilkan: 0 baris";

        try {
            const hasil = alasql(query);

            if (!hasil || hasil.length === 0) {
                jumlahData.innerText = "Menampilkan: 0 baris (Data tidak cocok)";
                return;
            }

            if (Array.isArray(hasil) && hasil.length > 0) {
                jumlahData.innerText = "Menampilkan: " + hasil.length + " baris";
                
                // Ambil Judul Kolom secara dinamis
                const kolom = Object.keys(hasil[0]);
                const trHead = document.createElement('tr');
                kolom.forEach(k => {
                    const th = document.createElement('th');
                    th.innerText = k;
                    trHead.appendChild(th);
                });
                thead.appendChild(trHead);

                // Masukkan Baris Nilai Data
                hasil.forEach(row => {
                    const trBody = document.createElement('tr');
                    kolom.forEach(k => {
                        const td = document.createElement('td');
                        td.innerText = row[k] !== undefined ? row[k] : '';
                        trBody.appendChild(td);
                    });
                    tbody.appendChild(trBody);
                });
            } else {
                jumlahData.innerText = "Perintah database non-SELECT sukses dieksekusi.";
            }
        } catch (err) {
            errorBox.innerText = "Sintaks SQL Salah Ketik: " + err.message;
            errorBox.style.display = "block";
        }
    }

    // Fungsi pencarian saat klik tombol Enter
    document.getElementById("sqlQuery").addEventListener("keyup", function(event) {
        if (event.key === "Enter") { jalankanQuery(); }
    });
</script>

</body>
</html>
