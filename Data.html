<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database SQL Terintegrasi di HTML</title>
    <!-- Memuat Library SQL.js via CDN resmi yang valid -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 30px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 1000px; margin: auto; }
        h2 { text-align: center; color: #2c3e50; }
        
        /* Dashboard Statistik */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 0.9rem; text-transform: uppercase; }
        .angka { font-size: 1.8rem; font-weight: bold; color: #2c3e50; margin: 0; }
        ul { padding-left: 20px; margin: 0; }

        /* Fitur Pencarian */
        .search-container { margin-bottom: 20px; text-align: left; }
        .search-input { width: 100%; max-width: 400px; padding: 12px 15px; border: 2px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52,152,219,0.3); }

        /* Tabel Data */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: #2c3e50; color: white; }
        tr:hover { background-color: #f9f9f9; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #3498db; }
        
        .loading { text-align: center; font-weight: bold; color: #7f8c8d; padding: 20px; }
        .empty-row { color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Database Siswa (HTML + SQL Search Engine)</h2>

    <!-- Tempat Output Statistik -->
    <div class="dashboard">
        <div class="card">
            <h3>Total Ringkasan</h3>
            <p class="angka" id="stat-siswa">Memuat database...</p>
        </div>
        <div class="card">
            <h3>Sebaran Per Kelas</h3>
            <ul id="stat-kelas"><li>Memuat database...</li></ul>
        </div>
    </div>

    <!-- Input Pencarian -->
    <div class="search-container">
        <input type="text" id="input-cari" class="search-input" placeholder="🔍 Ketik nama siswa untuk mencari..." oninput="cariDataSiswa()">
    </div>

    <!-- Tabel Utama -->
    <table>
        <thead>
            <tr>
                <th>Foto Orang</th>
                <th>Nomer</th>
                <th>Nama Siswa</th>
                <th>Kelas</th>
            </tr>
        </thead>
        <tbody id="tabel-siswa">
            <tr>
                <td colspan="4" class="empty-row">Silakan ketik nama siswa di kolom pencarian di atas.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let databaseSQL;

    const config = { 
        locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}` 
    };
    
    initSqlJs(config).then(function(SQL){
        databaseSQL = new SQL.Database();

        databaseSQL.run(`CREATE TABLE siswa (
            nomor TEXT PRIMARY KEY,
            nama_siswa TEXT NOT NULL,
            kelas TEXT NOT NULL,
            foto TEXT NOT NULL
        );`);

        databaseSQL.run(`INSERT INTO siswa VALUES 
            ('001', 'Adinda Calisya Putri', 'MP', 'https://ui-avatars.com/api/?name=Budi+Santoso&background=3498db&color=fff'),
            ('002', 'Siti Aminah', '12 RPL 1', 'https://ui-avatars.com/api/?name=Siti+Aminah&background=e74c3c&color=fff'),
            ('003', 'Rian Hidayat', '12 RPL 2', 'https://ui-avatars.com/api/?name=Rian+Hidayat&background=2ecc71&color=fff'),
            ('004', 'Alya Putri', '12 RPL 2', 'https://ui-avatars.com/api/?name=Alya+Putri&background=9b59b6&color=fff');
        `);

        // Hitung statistik saja saat awal load (tabel dibiarkan kosong)
        hitungStatistik();
    });

    function renderTabel(querySQL, param = []) {
        const tbody = document.getElementById('tabel-siswa');
        tbody.innerHTML = '';
        
        try {
            let barisSiswa = [];

            if (param.length > 0) {
                const stmt = databaseSQL.prepare(querySQL);
                stmt.bind(param);
                while (stmt.step()) {
                    barisSiswa.push(stmt.get());
                }
                stmt.free();
            } else {
                const hasilQuery = databaseSQL.exec(querySQL);
                if (hasilQuery.length > 0 && hasilQuery[0].values.length > 0) {
                    barisSiswa = hasilQuery[0].values;
                }
            }
            
            if (barisSiswa.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-row">Data siswa tidak ditemukan.</td></tr>`;
                return;
            }

            barisSiswa.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${row[0]}" class="avatar" alt="Foto"></td>
                        <td>${row[1]}</td>
                        <td><strong>${row[2]}</strong></td>
                        <td>${row[3]}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error(error);
            tbody.innerHTML = `<tr><td colspan="4" class="empty-row">Kesalahan Query SQL.</td></tr>`;
        }
    }

    function cariDataSiswa() {
        const keyword = document.getElementById('input-cari').value.trim();
        const tbody = document.getElementById('tabel-siswa');

        // Jika kotak pencarian dikosongkan, tabel kembali kosong
        if (keyword === "") {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-row">Silakan ketik nama siswa di kolom pencarian di atas.</td></tr>`;
            return;
        }
        
        const queryPencarian = `SELECT foto, nomor, nama_siswa, kelas FROM siswa 
                                WHERE nama_siswa LIKE ? OR nomor LIKE ? OR kelas LIKE ? 
                                ORDER BY nomor ASC`;
        
        renderTabel(queryPencarian, [`%${keyword}%`, `%${keyword}%`, `%${keyword}%`]);
    }

    function hitungStatistik() {
        const rumus_sql_2 = databaseSQL.exec("SELECT COUNT(*), COUNT(DISTINCT kelas) FROM siswa");
        const totalSiswa = rumus_sql_2[0].values[0][0];
        const totalKelas = rumus_sql_2[0].values[0][1];
        document.getElementById('stat-siswa').innerText = `${totalSiswa} Siswa (${totalKelas} Kelas)`;

        const rumus_sql_3 = databaseSQL.exec("SELECT kelas, COUNT(*) FROM siswa GROUP BY kelas");
        const barisKelas = rumus_sql_3[0].values;
        const ulKelas = document.getElementById('stat-kelas');
        ulKelas.innerHTML = '';
        
        barisKelas.forEach(row => {
            ulKelas.innerHTML += `<li>Kelas <strong>${row[0]}</strong>: ${row[1]} Orang</li>`;
        });
    }
</script>

</body>
</html>
